[package]
name = "aigis-core"
version = "0.2.0"
edition = "2021"
authors = ["Anton Vylderov"]
license = "MIT OR Apache-2.0"
description = "Post-quantum transaction verifier with Z3 and audit log"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
once_cell = "1.19"
blake3 = "1.5"
chrono = "0.4"
z3 = "0.13"
pqcrypto-kyber = "0.8"
pqcrypto-dilithium = "0.6"
zeroize = "1.7"

[dev-dependencies]
reqwest = "0.11"
tokio-test = "0.4"

[[bin]]
name = "server"
path = "src/axum_server.rs"

[[example]]
name = "audit_demo"
path = "examples/audit_demo.rs"
